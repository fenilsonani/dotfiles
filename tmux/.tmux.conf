# Tmux Configuration for Ghostty Terminal
# ========================================

# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support (click, scroll, resize)
set -g mouse on

# Use 256 color terminal
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable true color support for Ghostty
set-option -sa terminal-overrides ",*:RGB"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Display messages for 4 seconds
set -g display-time 4000

# Refresh status bar every 5 seconds
set -g status-interval 5

# Focus events enabled for terminals that support them
set -g focus-events on

# Enable aggressive resize
setw -g aggressive-resize on

# ========================================
# Key Bindings
# ========================================

# Reload config file with Prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split windows - Option+f for vertical, Option+Shift+f for horizontal (no prefix needed)
# Note: Tmux can't use Command key directly, using Option/Alt instead
bind -n M-f split-window -h -c "#{pane_current_path}"
bind -n M-F split-window -v -c "#{pane_current_path}"

# Alternative: Prefix + | for vertical, Prefix + - for horizontal
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Vim-like keys (Prefix + Shift + hjkl)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window navigation
bind -n M-h previous-window
bind -n M-l next-window

# Kill pane without confirmation
bind x kill-pane

# Kill window without confirmation
bind X kill-window

# Copy mode with vi keys
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ========================================
# Status Bar Styling
# ========================================

# Status bar colors
set -g status-style bg=default,fg=white

# Left status bar: session name
set -g status-left-length 40
set -g status-left "#[fg=green,bold][#S] "

# Right status bar: date and time
set -g status-right "#[fg=cyan]%d %b %R"

# Window status
setw -g window-status-format "#[fg=white] #I:#W "
setw -g window-status-current-format "#[fg=black,bg=green,bold] #I:#W "

# Pane border colors
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=green

# Message colors
set -g message-style bg=black,fg=green,bold

# ========================================
# Ghostty Integration
# ========================================

# Don't interfere with Ghostty's clipboard
set -g set-clipboard on

# Fast escape time (better for vim/neovim in tmux)
set -sg escape-time 0

# Allow passthrough for Ghostty features
set -g allow-passthrough on

