# Settings for `kitten ssh` (your `ssh` alias inside kitty)

# ── All hosts ─────────────────────────────────────────
hostname *
# reuse one connection: 2nd+ tab/split to same host opens instantly
share_connections yes
# lets `kitten @` and `icat`/clipboard work from the remote side
forward_remote_control yes

# ── Per-host colors: always know where you are ────────
hostname studio fenilmac
color_scheme Gruvbox Dark

hostname air
color_scheme Tokyo Night

# Production / servers: reddish so you think twice
hostname vps nc-prod-01 *.ts.net
color_scheme Red Alert
