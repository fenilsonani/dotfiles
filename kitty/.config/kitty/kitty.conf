# ── Font ──────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
disable_ligatures never

# ── Theme ─────────────────────────────────────────────
background_opacity 0.95
background_blur    20

# ── Window ────────────────────────────────────────────
window_padding_width 8
hide_window_decorations titlebar-only
remember_window_size  yes
confirm_os_window_close 1
enabled_layouts splits,stack,tall

# ── Tabs ──────────────────────────────────────────────
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  "{index}: {title}"

# ── Cursor / scrollback ───────────────────────────────
cursor_shape          block
scrollback_lines      10000
copy_on_select        yes
url_style             curly
detect_urls           yes

# ── Behavior ──────────────────────────────────────────
enable_audio_bell     no
shell_integration     enabled
macos_option_as_alt   yes
macos_quit_when_last_window_closed yes
allow_remote_control  socket-only
listen_on             unix:/tmp/kitty

# ── Keybindings (macOS-style) ─────────────────────────
map cmd+t       new_tab_with_cwd
map cmd+w       close_window
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+[       previous_window
map cmd+]       next_window
map cmd+left    neighboring_window left
map cmd+right   neighboring_window right
map cmd+up      neighboring_window up
map cmd+down    neighboring_window down
map cmd+shift+enter toggle_layout stack
map cmd+k       clear_terminal to_cursor active
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+,       edit_config_file
map cmd+shift+r load_config_file

# ── Kittens on keys ───────────────────────────────────
map cmd+/       launch --type=overlay less /Users/fenilsonani/.config/kitty/cheatsheet.txt
map cmd+shift+o open_url_with_hints
map cmd+shift+p kitten hints --type path --program -
map cmd+shift+l kitten hints --type line --program -
map cmd+shift+g kitten hints --type hash --program @
map cmd+e       kitten unicode_input
map cmd+shift+t kitten themes
map cmd+r       start_resizing_window
map cmd+f       show_scrollback
map cmd+shift+v launch --type=background --allow-remote-control /Users/fenilsonani/.config/kitty/paste-shot.sh
map cmd+shift+s launch --type=tab /Users/fenilsonani/.config/kitty/ssh-pick.sh


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME